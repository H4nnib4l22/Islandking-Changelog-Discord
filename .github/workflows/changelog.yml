name: Islandking Changelog -> Discord

on:
  workflow_dispatch:      # erlaubt manuellen Start über den "Run workflow"-Button
    inputs:
      manual_title:
        description: "Nur für nachträgliche Ergänzungen: Titel des bereits geposteten Eintrags"
        required: false
      manual_date:
        description: "Nur für nachträgliche Ergänzungen: Datum wie im Changelog angezeigt"
        required: false
      manual_items:
        description: "Nur für nachträgliche Ergänzungen: neue Punkte, ein Punkt pro Zeile"
        required: false

permissions:
  contents: write  # nötig, damit der Workflow state/posted.json zurückcommitten kann

concurrency:
  group: islandking-changelog
  cancel-in-progress: false

jobs:
  post-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Changelog prüfen und neue Einträge posten
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          MANUAL_TITLE: ${{ github.event.inputs.manual_title }}
          MANUAL_DATE: ${{ github.event.inputs.manual_date }}
          MANUAL_ITEMS: ${{ github.event.inputs.manual_items }}
        run: node scripts/post-changelog.mjs

      - name: Aktualisierten Stand zurückcommitten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen am state."
          else
            git commit -m "Update posted changelog state [skip ci]"
            git pull --rebase origin main
            git push
          fi
