name: Islandking Changelog -> Discord

on:
  schedule:
    - cron: "*/30 * * * *"  # alle 30 Minuten; Zeiten in UTC
  workflow_dispatch: {}      # erlaubt manuellen Start über den "Run workflow"-Button

permissions:
  contents: write  # nötig, damit der Workflow state/posted.json zurückcommitten kann

concurrency:
  group: islandking-changelog
  cancel-in-progress: false

jobs:
  post-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Changelog prüfen und neue Einträge posten
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: node scripts/post-changelog.mjs

      - name: Aktualisierten Stand zurückcommitten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen am state."
          else
            git commit -m "Update posted changelog state [skip ci]"
            git pull --rebase origin main
            git push
          fi
